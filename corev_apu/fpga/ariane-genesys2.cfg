# OpenOCD configuration for CVA6 on Genesys2 (1x1 tile = 1 hart)
#
# JTAG pins (from piton/design/xilinx/genesys2/constraints.xdc):
#   tck_i  → AD27
#   td_i   → W27
#   td_o   → W28
#   tms_i  → W29
#   trst_ni→ Y29
#
# Usage:
#   openocd -f ariane-genesys2.cfg
# Then connect GDB:
#   riscv64-unknown-elf-gdb <elf> -ex "target remote :3333"

# ------------------------------------------------------------------ #
# Adapter                                                            #
# ------------------------------------------------------------------ #
adapter speed 500

adapter driver ftdi

# FT2232H (dual-channel): VID=0x0403 PID=0x6010
# Adjust PID if your cable differs (FT232H single-channel = 0x6014)
ftdi_vid_pid 0x0403 0x6010

# Channel 0 carries JTAG
ftdi_channel 0

# MPSSE pin layout:
#   Bit 0 = TCK (out), Bit 1 = TDI (out), Bit 2 = TDO (in)
#   Bit 3 = TMS (out), Bit 4 = nTRST (out, active-low)
ftdi_layout_init 0x0018 0x001b
ftdi_layout_signal nTRST -ndata 0x0010

# ------------------------------------------------------------------ #
# JTAG TAP                                                           #
# ------------------------------------------------------------------ #
# CVA6 riscv-dbg TAP: IrLength=5, IDCODE=0x00000001
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00000001

# ------------------------------------------------------------------ #
# Debug target — 1x1 tile = 1 hart only                             #
# ------------------------------------------------------------------ #
set _TARGETNAME $_CHIPNAME.cpu

target create ${_TARGETNAME}.0 riscv -chain-position ${_TARGETNAME} -coreid 0

${_TARGETNAME}.0 configure -gdb-port 3333

# ------------------------------------------------------------------ #
# RISC-V debug settings                                              #
# ------------------------------------------------------------------ #
gdb_report_data_abort enable
gdb_report_register_access_error enable

riscv set_reset_timeout_sec 120
riscv set_command_timeout_sec 120

riscv set_prefer_sba off

# ------------------------------------------------------------------ #
# Start                                                              #
# ------------------------------------------------------------------ #
init
halt
echo "Ready: hart 0 -> port 3333"
