# OpenOCD configuration for multiCVA6 on VCU118 (multi-hart)
# Tested with OpenOCD 0.11.0
#
# JTAG adapter: FTDI FT2232H-based cable (e.g. Digilent HS2/HS3)
# connected to VCU118 Bank-47 JTAG header (see constraints.xdc):
#   tck_i  → N28   tdi (td_i) → M30
#   tdo (td_o) → N30   tms_i → P30   trst_ni → P29
#
# Usage:
#   openocd -f ariane-multi-hart.cfg
# Then connect GDB instances:
#   riscv64-unknown-elf-gdb <elf> -ex "target remote :3333"   # hart 0
#   riscv64-unknown-elf-gdb <elf> -ex "target remote :3334"   # hart 1
#   riscv64-unknown-elf-gdb <elf> -ex "target remote :3335"   # hart 2
#   riscv64-unknown-elf-gdb <elf> -ex "target remote :3336"   # hart 3

# ------------------------------------------------------------------ #
# Adapter                                                            #
# ------------------------------------------------------------------ #
# 'adapter speed' replaces deprecated 'adapter_khz'
adapter speed 1000

# 'adapter driver' replaces deprecated 'interface'
adapter driver ftdi

# VCU118 uses FTDI FT2232H (dual-channel).
# VID:PID 0x0403:0x6010 matches FT2232H (Digilent HS2/HS3 and generic cables).
# NOTE: the original file had 0x6014 (FT232H single-channel) which is wrong
#       for the VCU118 JTAG setup.
ftdi_vid_pid 0x0403 0x6014

# Channel 0 carries JTAG; channel 1 is reserved for Xilinx BScan
ftdi_channel 0

# MPSSE pin layout for ADBUS port:
#   Bit  MPSSE   FT2232  JTAG    Dir    Description
#   0    TCK     ADBUS0  TCK     Out    Clock
#   1    TDI     ADBUS1  TDI     Out    Data out
#   2    TDO     ADBUS2  TDO     In     Data in
#   3    TMS     ADBUS3  TMS     Out    Mode select
#   4    GPIOL0  ADBUS4  nTRST   Out    Reset (active-low)
#
# layout_init <value> <direction>:
#   0x0018 = bits 4 and 3 driven high at init (nTRST deasserted, TMS=1)
#   0x001b = bits 4,3,1,0 are outputs (nTRST, TMS, TDI, TCK)
ftdi_layout_init 0x0018 0x001b
ftdi_layout_signal nTRST -ndata 0x0010

# ------------------------------------------------------------------ #
# JTAG TAP                                                           #
# ------------------------------------------------------------------ #
# CVA6 riscv-dbg TAP: IrLength=5, IDCODE=0x00000001 (dmi_jtag_tap.sv)
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00000001

# ------------------------------------------------------------------ #
# Debug targets — one per hart                                       #
# ------------------------------------------------------------------ #
# OpenPiton 2x2 config has 4 harts (hart IDs 0-3), all reachable
# through the single JTAG DTM via the DM hartsel register.
# Each target shares the same JTAG chain position but uses a different
# coreid so OpenOCD selects the hart via DM hartsel.

set _TARGETNAME $_CHIPNAME.cpu

target create ${_TARGETNAME}.0 riscv -chain-position ${_TARGETNAME} -coreid 0
target create ${_TARGETNAME}.1 riscv -chain-position ${_TARGETNAME} -coreid 1
target create ${_TARGETNAME}.2 riscv -chain-position ${_TARGETNAME} -coreid 2
target create ${_TARGETNAME}.3 riscv -chain-position ${_TARGETNAME} -coreid 3

# Bind all harts into one SMP group so a breakpoint on any hart
# halts all harts simultaneously.
target smp ${_TARGETNAME}.0 ${_TARGETNAME}.1 ${_TARGETNAME}.2 ${_TARGETNAME}.3

# Assign a GDB server port to each hart.
# Connect with: target remote localhost:<port>
${_TARGETNAME}.0 configure -gdb-port 3333
${_TARGETNAME}.1 configure -gdb-port 3334
${_TARGETNAME}.2 configure -gdb-port 3335
${_TARGETNAME}.3 configure -gdb-port 3336

# ------------------------------------------------------------------ #
# RISC-V debug settings (applied to whichever target is current)     #
# ------------------------------------------------------------------ #
gdb_report_data_abort enable
gdb_report_register_access_error enable

riscv set_reset_timeout_sec 120
riscv set_command_timeout_sec 120

# Use abstract commands for register access instead of system bus.
# System bus access (sba) can be unreliable across tile boundaries.
riscv set_prefer_sba off

# ------------------------------------------------------------------ #
# Start                                                              #
# ------------------------------------------------------------------ #
init
halt
echo "Ready for Remote Connections"
echo "  hart 0 -> port 3333"
echo "  hart 1 -> port 3334"
echo "  hart 2 -> port 3335"
echo "  hart 3 -> port 3336"
